<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Squircle (Solid Flat Dark Navy-Charcoal) -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="#0E1118" stroke="#1E2433" stroke-width="4"/>

  <!-- Subtle Minimal Wave Axis Grid (Solid Flat) -->
  <g stroke="#262D40" stroke-width="2">
    <line x1="80" y1="180" x2="432" y2="180" stroke-dasharray="4,8"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="332" x2="432" y2="332" stroke-dasharray="4,8"/>
  </g>

  <!-- FLAT MONOGRAM EQUALIZER BARS (No Shadow, No Aurora, No Gradients) -->
  <g>
    <!-- ====== 'L' Equalizer Bars (Solid Flat Cyan #00F0FF) ====== -->
    <rect x="116" y="130" width="28" height="230" rx="14" fill="#00F0FF"/>
    <rect x="156" y="170" width="28" height="190" rx="14" fill="#00F0FF"/>
    <rect x="196" y="270" width="28" height="90" rx="14" fill="#00F0FF"/>
    <rect x="236" y="324" width="36" height="36" rx="14" fill="#00F0FF"/>

    <!-- ====== 'S' Equalizer Flow (Solid Flat Apple Pink #FF2D55) ====== -->
    <rect x="284" y="130" width="100" height="28" rx="14" fill="#FF2D55"/>
    <rect x="284" y="166" width="28" height="48" rx="14" fill="#FF2D55"/>
    <rect x="274" y="238" width="102" height="28" rx="14" fill="#FF2D55"/>
    <rect x="356" y="274" width="28" height="52" rx="14" fill="#FF2D55"/>
    <rect x="260" y="332" width="124" height="28" rx="14" fill="#FF2D55"/>
  </g>

  <!-- High-Res Discrete Indicators (Solid Flat Status Dots) -->
  <g>
    <circle cx="388" cy="100" r="6" fill="#00F0FF"/>
    <circle cx="410" cy="100" r="6" fill="#FFFFFF"/>
    <circle cx="432" cy="100" r="6" fill="#FF2D55"/>
  </g>

  <!-- Audiophile Label (Solid Flat) -->
  <text x="256" y="420" font-family="'Segoe UI', -apple-system, sans-serif" font-size="19" font-weight="700" letter-spacing="4" fill="#5A6278" text-anchor="middle">
    BIT-PERFECT <tspan fill="#00F0FF">192</tspan><tspan fill="#FF2D55">k</tspan>
  </text>
</svg>