[package]
name = "lossless-switcher-am"
version = "0.1.0"
edition = "2024"
authors = ["Pratama Putra"]
license = "GPL-3.0-only"
repository = "https://github.com/pratama1246/AMWin-LosslessSwitcher"

[lib]
name = "lossless_switcher_am"
path = "src/lib.rs"

[[bin]]
name = "lossless-switcher-am"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }
windows-core = "0.58"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }

[build-dependencies]
embed-resource = "2.5"
